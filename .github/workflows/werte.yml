name: Werte ermitteln

# Durchsucht täglich alle Quellen und aktualisiert werte.json für die Webversion.
on:
  schedule:
    - cron: "17 4 * * *"   # täglich ca. 5:17 / 6:17 Uhr
  workflow_dispatch:         # manuell starten: Reiter Actions -> Werte ermitteln -> Run workflow

permissions:
  contents: write

jobs:
  werte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Werte aus den Webquellen ermitteln
        run: python werkzeug/werte_ermitteln.py werte.json
      - name: werte.json speichern
        run: |
          if [ -n "$(git status --porcelain werte.json)" ]; then
            git config user.name "werte-dienst"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add werte.json
            git commit -m "Werte aktualisiert"
            git push
          fi
